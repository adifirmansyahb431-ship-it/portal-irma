<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan Kegiatan - Portal IRMA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: #f4f7f6; padding: 20px; color: #333; }

    /* HEADER POLOS & TOMBOL KEMBALI */
    .page-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 2px solid #e0e0e0; padding-bottom: 15px; }
    .btn-kembali { background: #6c757d; color: white; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; transition: 0.2s; border: none; cursor: pointer; }
    .btn-kembali:hover { background: #5a6268; }
    .page-header h2 { color: #0a3622; font-size: 22px; }

    /* DAFTAR KEGIATAN */
    .kegiatan-list { display: flex; flex-direction: column; gap: 15px; }
    .kegiatan-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; gap: 20px; align-items: flex-start; border-left: 5px solid #d4af37; }
    
    /* KOTAK TANGGAL */
    .tanggal-box { background: #0a3622; color: #d4af37; padding: 10px; border-radius: 8px; text-align: center; min-width: 80px; flex-shrink: 0; }
    .tanggal-box .hari { font-size: 24px; font-weight: bold; display: block; line-height: 1; }
    .tanggal-box .bulan { font-size: 12px; text-transform: uppercase; }
    
    /* INFO KEGIATAN */
    .info-kegiatan { flex: 1; }
    .info-kegiatan h4 { margin: 0 0 5px 0; color: #0a3622; font-size: 18px; font-weight: 700; }
    .info-kegiatan p { margin: 0 0 8px 0; color: #555; font-size: 14px; line-height: 1.5; }
    .info-kegiatan .jam { font-size: 12px; color: #888; display: block; margin-bottom: 10px; }
    
    /* LAMPIRAN */
    .lampiran { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .lampiran a { display: inline-flex; align-items: center; gap: 5px; background: #e8f5e9; color: #0a3622; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 600; border: 1px solid #c8e6c9; transition: 0.2s; }
    .lampiran a:hover { background: #c8e6c9; }

    /* LOADING & ERROR */
    .loading { text-align: center; padding: 40px; color: #777; font-style: italic; }
    .error-box { background: #ffebee; color: #c62828; padding: 20px; border-radius: 8px; text-align: center; }

    @media (max-width: 600px) {
      .kegiatan-card { flex-direction: column; gap: 15px; }
      .tanggal-box { width: 100%; display: flex; justify-content: center; gap: 10px; align-items: center; }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyBjA8-_2it1AXMrEH7AcnprCasmKj0Mzmc",
      authDomain: "portal-irma-man-3-bogor.firebaseapp.com",
      projectId: "portal-irma-man-3-bogor",
      storageBucket: "portal-irma-man-3-bogor.firebasestorage.app",
      messagingSenderId: "582215464487",
      appId: "1:582215464487:web:4d0583016ebec700dec002"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // FUNGSI TOMBOL KEMBALI CERDAS
    window.kembaliCerdas = function() {
      // 1. Jika dibuka di dalam iframe (dari beranda-siswa.html)
      if (window.parent && window.parent !== window) {
        window.parent.postMessage('tutup-iframe', '*');
        return;
      }

      // 2. Jika dibuka langsung, cek dari mana asalnya
      const asalHalaman = document.referrer;
      if (asalHalaman.includes("beranda.html") || asalHalaman.includes("bendahara.html") || asalHalaman.includes("admin-informasi.html")) {
        window.location.href = 'beranda.html';
      } else if (asalHalaman.includes("beranda-siswa.html")) {
        window.location.href = 'beranda-siswa.html';
      } else {
        // Fallback jika referrer kosong
        const userLoginData = localStorage.getItem("userLoginData");
        if (userLoginData) {
          const user = JSON.parse(userLoginData);
          if (user.email === "admin@irma.sch.id" || user.email === "bendahara@irma.sch.id") {
            window.location.href = 'beranda.html';
          } else {
            window.location.href = 'beranda-siswa.html';
          }
        } else {
          window.location.href = 'index.html';
        }
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("daftarKegiatanSiswa");
      
      try {
        // Mengambil data dari collection "KegiatanIRMA"
        const querySnapshot = await getDocs(collection(db, "KegiatanIRMA"));
        
        if (querySnapshot.empty) {
          container.innerHTML = `<div class="error-box" style="background:#f8f9fa; color:#666; border:1px solid #ddd;">Belum ada laporan kegiatan yang diposting.</div>`;
          return;
        }

        let dataArr = [];
        querySnapshot.forEach((doc) => {
          dataArr.push({ id: doc.id, ...doc.data() });
        });
        
        // Urutkan berdasarkan tanggal terbaru
        dataArr.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

        let html = "";
        dataArr.forEach((d) => {
          const tgl = new Date(d.tanggal);
          const hari = tgl.getDate();
          const bulan = tgl.toLocaleString('id-ID', { month: 'short' });

          let lampiran = "";
          if (d.catatan) lampiran += `<a href="${d.catatan}" target="_blank">📄 Catatan Materi</a>`;
          if (d.foto) lampiran += `<a href="${d.foto}" target="_blank">🖼️ Foto Kegiatan</a>`;

          html += `
            <div class="kegiatan-card">
              <div class="tanggal-box">
                <span class="hari">${hari}</span>
                <span class="bulan">${bulan}</span>
              </div>
              <div class="info-kegiatan">
                <h4>${d.nama}</h4>
                <p>${d.deskripsi || '-'}</p>
                <span class="jam">⏰ ${d.jam || 'Waktu belum ditentukan'}</span>
                <div class="lampiran">${lampiran}</div>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;

      } catch (err) {
        console.error("Error Firebase:", err);
        container.innerHTML = `<div class="error-box">Gagal memuat data kegiatan: ${err.message}</div>`;
      }
    });
  </script>
</head>
<body>

  <!-- HEADER DENGAN TOMBOL KEMBALI -->
  <div class="page-header">
    <button onclick="kembaliCerdas()" class="btn-kembali">← Kembali</button>
    <h2>📅 Laporan Kegiatan IRMA</h2>
  </div>

  <!-- DAFTAR KEGIATAN -->
  <div id="daftarKegiatanSiswa" class="kegiatan-list">
    <div class="loading">Memuat data kegiatan...</div>
  </div>

</body>
</html>
