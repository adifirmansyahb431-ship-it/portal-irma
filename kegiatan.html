<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kegiatan IRMA MAN 3 BOGOR - Portal IRMA</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; margin: 0; color: #333; }
    .card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 800px; margin: 0 auto; }
    h2 { color: #0a3622; text-align: center; margin-top: 0; }
    
    .kegiatan-item { display: flex; gap: 20px; padding: 20px; border-bottom: 1px solid #eee; align-items: center; }
    .kegiatan-item:last-child { border-bottom: none; }
    .tanggal { background: #0a3622; color: #d4af37; padding: 10px 15px; border-radius: 8px; text-align: center; min-width: 80px; }
    .tanggal .hari { font-size: 24px; font-weight: bold; display: block; line-height: 1; }
    .tanggal .bulan { font-size: 12px; text-transform: uppercase; }
    .info-kegiatan h3 { margin: 0 0 5px 0; color: #0a3622; font-size: 18px; }
    .info-kegiatan p { margin: 0; color: #666; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📅 Agenda Kegiatan IRMA</h2>
    
    <div class="kegiatan-item">
      <div class="tanggal">
        <span class="hari">12</span>
        <span class="bulan">Des</span>
      </div>
      <div class="info-kegiatan">
        <h3>Kajian Rutin & Silaturahmi</h3>
        <p>Waktu: 08:00 - 11:00 WIB | Tempat: Masjid MAN 3 Bogor</p>
      </div>
    </div>

    <div class="kegiatan-item">
      <div class="tanggal">
        <span class="hari">20</span>
        <span class="bulan">Des</span>
      </div>
      <div class="info-kegiatan">
        <h3>Bakti Sosial & Donor Darah</h3>
        <p>Waktu: 07:30 - 12:00 WIB | Tempat: Aula MAN 3 Bogor</p>
      </div>
    </div>

    <div class="kegiatan-item">
      <div class="tanggal">
        <span class="hari">31</span>
        <span class="bulan">Des</span>
      </div>
      <div class="info-kegiatan">
        <h3>Muhasabah Akhir Tahun</h3>
        <p>Waktu: 19:00 - 21:00 WIB | Tempat: Masjid MAN 3 Bogor</p>
      </div>
    </div>

  </div>

</body>
</html>
