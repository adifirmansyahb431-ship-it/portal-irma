<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ubah Password - Portal IRMA</title>
  <style>
    :root {
      --primary-color: #0a3622;
      --accent-color: #d4af37;
      --bg-color: #f4f7f6;
      --text-color: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: var(--text-color);
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 15px;
    }

    .header h2 { color: var(--primary-color); margin: 0; }
    .header p { color: #666; margin-top: 5px; font-size: 14px; }

    .form-group { margin-bottom: 20px; }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--primary-color);
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: inherit;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 5px rgba(10, 54, 34, 0.2);
    }

    .btn-submit {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
    }

    .btn-submit:hover { background-color: #072517; }

    .alert {
      display: none;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-danger {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>🔒 Ubah Password</h2>
      <p>Perbarui kata sandi akun Anda</p>
    </div>

    <!-- Pesan Notifikasi -->
    <div id="alertBox" class="alert"></div>

    <form id="formPassword" onsubmit="ubahPassword(event)">
      
      <div class="form-group">
        <label for="passwordLama">Password Lama</label>
        <input type="password" id="passwordLama" placeholder="Masukkan password saat ini" required>
      </div>

      <div class="form-group">
        <label for="passwordBaru">Password Baru</label>
        <input type="password" id="passwordBaru" placeholder="Minimal 6 karakter" required minlength="6">
      </div>

      <div class="form-group">
        <label for="konfirmasiPassword">Konfirmasi Password Baru</label>
        <input type="password" id="konfirmasiPassword" placeholder="Ketik ulang password baru" required minlength="6">
      </div>

      <button type="submit" class="btn-submit">Simpan Perubahan</button>
    </form>
  </div>

  <script>
    // Simulasi: Anggap password awal siswa adalah "irma123" (Bisa disesuaikan)
    const DEFAULT_PASSWORD = "irma123"; 

    function ubahPassword(event) {
      event.preventDefault();

      const passLama = document.getElementById('passwordLama').value;
      const passBaru = document.getElementById('passwordBaru').value;
      const passKonfirmasi = document.getElementById('konfirmasiPassword').value;
      const alertBox = document.getElementById('alertBox');

      // 1. Cek password lama
      if (passLama !== DEFAULT_PASSWORD) {
        tampilkanAlert("Password lama Anda salah!", "danger");
        return;
      }

      // 2. Cek kecocokan password baru
      if (passBaru !== passKonfirmasi) {
        tampilkanAlert("Password baru dan konfirmasi tidak cocok!", "danger");
        return;
      }

      // 3. Cek apakah password baru sama dengan yang lama
      if (passLama === passBaru) {
        tampilkanAlert("Password baru tidak boleh sama dengan password lama!", "danger");
        return;
      }

      // Jika semua validasi lolos (Simulasi Sukses)
      tampilkanAlert("Password berhasil diubah! Silakan gunakan password baru Anda saat login nanti.", "success");
      
      // Reset form
      document.getElementById('formPassword').reset();
    }

    function tampilkanAlert(pesan, tipe) {
      const alertBox = document.getElementById('alertBox');
      alertBox.innerHTML = pesan;
      alertBox.className = `alert alert-${tipe}`;
      alertBox.style.display = 'block';
      
      // Sembunyikan pesan setelah 4 detik
      setTimeout(() => {
        alertBox.style.display = 'none';
      }, 4000);
    }
  </script>

</body>
</html>
