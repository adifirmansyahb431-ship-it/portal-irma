<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Anggota - Portal IRMA</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; margin: 0; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h3 { color: #0a3622; margin-top: 0; border-bottom: 2px solid #d4af37; padding-bottom: 10px; display: inline-block; }
    
    /* FORM INPUT */
    .form-group { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
    .form-group input { flex: 1; min-width: 200px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
    .btn-simpan { background: #0a3622; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; height: fit-content; }
    .btn-simpan:hover { background: #1a5c3a; }

    /* TABEL DATA */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e5e7eb; padding: 12px; text-align: left; vertical-align: middle; }
    th { background: #0a3622; color: white; }
    
    /* TOMBOL AKSI */
    .btn-action { padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; border: none; color: white; margin-right: 5px; }
    .btn-edit { background: #f39c12; }
    .btn-hapus { background: #e74c3c; }
    
    .loading { text-align: center; color: #666; font-style: italic; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjA8-_2it1AXMrEH7AcnprCasmKj0Mzmc",
      authDomain: "portal-irma-man-3-bogor.firebaseapp.com",
      projectId: "portal-irma-man-3-bogor",
      storageBucket: "portal-irma-man-3-bogor.firebasestorage.app",
      messagingSenderId: "582215464487",
      appId: "1:582215464487:web:4d0583016ebec700dec002"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
    window.fb = { collection, addDoc, getDocs, deleteDoc, doc, updateDoc, getDoc };
  </script>
</head>
<body>

  <div class="card">
    <h3>➕ Tambah Data Anggota</h3>
    <div class="form-group">
      <input type="text" id="inNama" placeholder="Nama Lengkap">
      <input type="text" id="inNis" placeholder="NIS / Kelas">
      <input type="text" id="inJabatan" placeholder="Jabatan (Ketua/Anggota/dll)">
      <button class="btn-simpan" onclick="simpanData()">Simpan Data</button>
    </div>
  </div>

  <div class="card">
    <h3>📋 Daftar Anggota IRMA</h3>
    <table>
      <thead>
        <tr>
          <th style="width: 50px; text-align: center;">No</th>
          <th>Nama Lengkap</th>
          <th>NIS / Kelas</th>
          <th>Jabatan</th>
          <th style="width: 150px; text-align: center;">Aksi</th>
        </tr>
      </thead>
      <tbody id="tabelAnggota">
        <tr><td colspan="5" class="loading">Memuat data dari Firebase...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let editId = null;

    // FUNGSI SIMPAN (TAMBAH / EDIT)
    window.simpanData = async function() {
      const nama = document.getElementById("inNama").value;
      const nis = document.getElementById("inNis").value;
      const jabatan = document.getElementById("inJabatan").value;

      if (!nama || !nis || !jabatan) {
        alert("Harap isi semua kolom data anggota!");
        return;
      }

      const dataAnggota = {
        nama: nama,
        nis: nis,
        jabatan: jabatan,
        tanggalDaftar: new Date().toISOString()
      };

      try {
        const { collection, addDoc, doc, updateDoc } = window.fb;
        
        if (editId) {
          await updateDoc(doc(window.db, "AnggotaIRMA", editId), dataAnggota);
          alert("✅ Data anggota berhasil diperbarui!");
          editId = null;
        } else {
          await addDoc(collection(window.db, "AnggotaIRMA"), dataAnggota);
          alert("✅ Data anggota berhasil disimpan!");
        }

        document.getElementById("inNama").value = "";
        document.getElementById("inNis").value = "";
        document.getElementById("inJabatan").value = "";
        
        muatData();
      } catch (error) {
        console.error(error);
        alert("❌ Gagal menyimpan data: " + error.message);
      }
    }

    // FUNGSI MEMUAT DATA
    async function muatData() {
      const tbody = document.getElementById("tabelAnggota");
      tbody.innerHTML = '<tr><td colspan="5" class="loading">Memuat data...</td></tr>';

      try {
        const { collection, getDocs } = window.fb;
        const querySnapshot = await getDocs(collection(window.db, "AnggotaIRMA"));
        
        if (querySnapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada data anggota.</td></tr>';
          return;
        }

        let dataArr = [];
        querySnapshot.forEach((docSnap) => {
          dataArr.push({ id: docSnap.id, ...docSnap.data() });
        });
        dataArr.sort((a, b) => a.nama.localeCompare(b.nama));

        let html = "";
        let no = 1;
        dataArr.forEach((d) => {
          html += `
            <tr>
              <td style="text-align:center;">${no++}</td>
              <td><b>${d.nama}</b></td>
              <td>${d.nis}</td>
              <td>${d.jabatan}</td>
              <td style="text-align:center;">
                <button class="btn-action btn-edit" onclick="editData('${d.id}')">Edit</button>
                <button class="btn-action btn-hapus" onclick="hapusData('${d.id}', '${d.nama}')">Hapus</button>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;

      } catch (error) {
        console.error(error);
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Gagal memuat data.</td></tr>';
      }
    }

    // FUNGSI EDIT
    window.editData = async function(id) {
      try {
        const { doc, getDoc } = window.fb;
        const docSnap = await getDoc(doc(window.db, "AnggotaIRMA", id));
        if (docSnap.exists()) {
          const d = docSnap.data();
          document.getElementById("inNama").value = d.nama;
          document.getElementById("inNis").value = d.nis;
          document.getElementById("inJabatan").value = d.jabatan;
          editId = id;
          window.scrollTo(0, 0);
          alert("Silakan ubah data, lalu klik 'Simpan Data'.");
        }
      } catch (error) { console.error(error); }
    }

    // FUNGSI HAPUS
    window.hapusData = async function(id, nama) {
      if (!confirm(`Yakin ingin menghapus data "${nama}"?`)) return;
      try {
        const { doc, deleteDoc } = window.fb;
        await deleteDoc(doc(window.db, "AnggotaIRMA", id));
        alert("🗑️ Data berhasil dihapus!");
        muatData();
      } catch (error) {
        console.error(error);
        alert("❌ Gagal menghapus data.");
      }
    }

    // JALANKAN SAAT HALAMAN DIMUAT
    window.onload = muatData;
  </script>
</body>
</html>
