<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Anggota - Portal IRMA</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; margin: 0; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h3 { color: #0a3622; margin-top: 0; border-bottom: 2px solid #d4af37; padding-bottom: 10px; display: inline-block; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e5e7eb; padding: 12px; text-align: left; vertical-align: middle; }
    th { background: #0a3622; color: white; text-align: center; }
    
    .foto-tabel { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #d4af37; display: block; margin: 0 auto; }
    
    .btn-action { padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; border: none; color: white; margin-right: 5px; }
    .btn-view { background: #3498db; }
    .btn-hapus { background: #e74c3c; }
    
    .loading { text-align: center; color: #666; font-style: italic; padding: 20px; }

    /* Modal untuk detail biodata */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); overflow: auto; }
    .modal-content { background: white; margin: 30px auto; padding: 30px; border-radius: 12px; max-width: 650px; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .close { position: absolute; top: 10px; right: 20px; font-size: 28px; font-weight: bold; cursor: pointer; color: #333; }
    .modal-content h2 { color: #0a3622; text-align: center; margin-top: 0; }
    
    .modal-profil-container { display: flex; gap: 20px; align-items: flex-start; }
    .modal-foto { width: 120px; height: 160px; object-fit: cover; border-radius: 8px; border: 3px solid #d4af37; }
    .modal-data { flex: 1; }
    
    .modal-data .form-group { margin-bottom: 8px; }
    .modal-data label { font-weight: bold; font-size: 12px; color: #0a3622; display: block; }
    .modal-data input, .modal-data textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; background: #f9f9f9; font-size: 13px; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjA8-_2it1AXMrEH7AcnprCasmKj0Mzmc",
      authDomain: "portal-irma-man-3-bogor.firebaseapp.com",
      projectId: "portal-irma-man-3-bogor",
      storageBucket: "portal-irma-man-3-bogor.firebasestorage.app",
      messagingSenderId: "582215464487",
      appId: "1:582215464487:web:4d0583016ebec700dec002"
    };
    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.fb = { collection, getDocs, deleteDoc, doc, getDoc };
  </script>
</head>
<body>

  <div class="card">
    <h3>📋 Daftar Anggota IRMA</h3>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th style="width: 50px;">No</th>
            <th style="width: 70px;">Foto</th>
            <th>Nama Lengkap</th>
            <th>NIS</th>
            <th>Kelas / Jurusan</th>
            <th style="width: 150px;">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelAnggota">
          <tr><td colspan="6" class="loading">Memuat data dari Firebase...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- MODAL DETAIL BIODATA -->
  <div id="modalDetail" class="modal">
    <div class="modal-content">
      <span class="close" onclick="tutupModal()">&times;</span>
      <h2>Detail Biodata Siswa</h2>
      
      <div class="modal-profil-container">
        <img id="modalFoto" src="" class="modal-foto" alt="Foto Profil">
        
        <div class="modal-data">
          <div class="form-group"><label>No. ID Anggota</label><input type="text" id="modalNoId" readonly></div>
          <div class="form-group"><label>Jabatan</label><input type="text" id="modalJabatan" readonly></div>
          <div class="form-group"><label>Nama Lengkap</label><input type="text" id="modalNama" readonly></div>
          <div class="form-group"><label>NIS</label><input type="text" id="modalNis" readonly></div>
          <div class="form-group"><label>Kelas / Jurusan</label><input type="text" id="modalKelas" readonly></div>
          <div class="form-group"><label>Tempat, Tanggal Lahir</label><input type="text" id="modalTtl" readonly></div>
          <div class="form-group"><label>No. HP Siswa</label><input type="text" id="modalNoHp" readonly></div>
          <div class="form-group"><label>Nama Orang Tua</label><input type="text" id="modalNamaOrtu" readonly></div>
          <div class="form-group"><label>No. HP Orang Tua</label><input type="text" id="modalHpOrtu" readonly></div>
          <div class="form-group"><label>Alamat</label><textarea id="modalAlamat" rows="2" readonly></textarea></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function muatData() {
      const tbody = document.getElementById("tabelAnggota");
      tbody.innerHTML = '<tr><td colspan="6" class="loading">Memuat data...</td></tr>';

      try {
        const { collection, getDocs } = window.fb;
        const querySnapshot = await getDocs(collection(window.db, "AnggotaIRMA"));
        
        if (querySnapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Belum ada data anggota.</td></tr>';
          return;
        }

        let html = "";
        let no = 1;
        querySnapshot.forEach((docSnap) => {
          const d = docSnap.data();
          
          const fotoSrc = d.fotoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(d.nama)}&background=0a3622&color=fff&size=50`;
          
          html += `
            <tr>
              <td style="text-align:center;">${no++}</td>
              <td><img src="${fotoSrc}" class="foto-tabel"></td>
              <td><b>${d.nama}</b></td>
              <td>${d.nis}</td>
              <td>${d.kelas} - ${d.jurusan}</td>
              <td style="text-align:center;">
                <button class="btn-action btn-view" onclick="lihatDetail('${docSnap.id}')">View</button>
                <button class="btn-action btn-hapus" onclick="hapusData('${docSnap.id}', '${d.nama}')">Hapus</button>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;

      } catch (error) {
        console.error(error);
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Gagal memuat data.</td></tr>';
      }
    }

    window.lihatDetail = async function(id) {
      try {
        const { doc, getDoc } = window.fb;
        const docSnap = await getDoc(doc(window.db, "AnggotaIRMA", id));
        if (docSnap.exists()) {
          const d = docSnap.data();
          
          document.getElementById("modalFoto").src = d.fotoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(d.nama)}&background=0a3622&color=fff&size=120`;
          document.getElementById("modalNoId").value = d.noId || "-";
          document.getElementById("modalJabatan").value = d.jabatan || "-";
          document.getElementById("modalNama").value = d.nama || "-";
          document.getElementById("modalNis").value = d.nis || "-";
          document.getElementById("modalKelas").value = (d.kelas || "-") + " / " + (d.jurusan || "-");
          document.getElementById("modalTtl").value = (d.tempatLahir || "-") + ", " + (d.tanggalLahir || "-");
          document.getElementById("modalNoHp").value = d.noHp || "-";
          document.getElementById("modalNamaOrtu").value = d.namaOrtu || "-";
          document.getElementById("modalHpOrtu").value = d.noHpOrtu || "-";
          document.getElementById("modalAlamat").value = d.alamat || "-";
          
          document.getElementById("modalDetail").style.display = "block";
        }
      } catch (error) {
        console.error(error);
        alert("Gagal memuat detail biodata.");
      }
    }

    window.tutupModal = function() {
      document.getElementById("modalDetail").style.display = "none";
    }

    window.hapusData = async function(id, nama) {
      if (!confirm(`Yakin ingin menghapus data "${nama}"?`)) return;
      try {
        const { doc, deleteDoc } = window.fb;
        await deleteDoc(doc(window.db, "AnggotaIRMA", id));
        alert("🗑️ Data berhasil dihapus!");
        muatData();
      } catch (error) {
        console.error(error);
        alert("❌ Gagal menghapus data.");
      }
    }

    window.onload = muatData;
  </script>
</body>
</html>
