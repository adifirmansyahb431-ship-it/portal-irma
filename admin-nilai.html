<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelola Nilai Ekstrakurikuler - Admin IRMA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
    * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    body { background-color: #f4f6f9; margin: 0; display: flex; height: 100vh; overflow: hidden; }
    
    /* SIDEBAR */
    .sidebar { width: 260px; background-color: #0b3c29; color: white; display: flex; flex-direction: column; padding: 20px 0; box-shadow: 4px 0 10px rgba(0,0,0,0.05); }
    .sidebar-logo { text-align: center; padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-logo img { width: 50px; height: 50px; object-fit: contain; }
    .sidebar-logo h3 { margin: 10px 0 2px; font-size: 16px; color: #ffb703; }
    .sidebar-logo p { margin: 0; font-size: 11px; color: #adb5bd; }
    .menu-list { list-style: none; padding: 0; margin: 20px 0; overflow-y: auto; flex-grow: 1; }
    .menu-item a { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: #adb5bd; text-decoration: none; font-size: 13px; font-weight: 600; transition: 0.2s; }
    .menu-item.active a, .menu-item a:hover { background-color: rgba(255,255,255,0.1); color: white; border-left: 4px solid #ffb703; }

    /* MAIN CONTENT */
    .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }
    .topbar { background: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .topbar-left { display: flex; align-items: center; gap: 20px; }
    .topbar h2 { margin: 0; color: #0b3c29; font-size: 18px; }
    
    .btn-kembali { background: #6c757d; color: white; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; transition: 0.2s; border: none; cursor: pointer; }
    .btn-kembali:hover { background: #5a6268; }
    .btn-keluar { background: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px; }

    .content-body { padding: 30px; max-width: 1100px; width: 100%; margin: 0 auto; }
    .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    
    /* FILTER KELAS */
    .filter-container { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; background: #f8f9fa; padding: 15px 20px; border-radius: 8px; border: 1px solid #eee; flex-wrap: wrap; }
    .filter-container label { font-weight: 700; color: #0b3c29; font-size: 14px; }
    .filter-container select { padding: 10px 15px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 14px; font-weight: 600; color: #333; min-width: 200px; cursor: pointer; }

    /* TOMBOL AKSI */
    .btn-cetak-rekap { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; }
    .btn-cetak-rekap:hover { background: #2980b9; }
    .btn-simpan { background: #2a9d8f; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; }
    .btn-simpan:hover { background: #21867a; }

    /* TABEL NILAI */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
    th { background: #f8f9fa; color: #0b3c29; font-weight: 700; text-transform: uppercase; font-size: 11px; }
    input[type="number"] { width: 60px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-weight: bold; }
    
    /* BADGE NILAI & PREDIKAT */
    .nilai-akhir { font-weight: 700; color: #0b3c29; background: #e8f5e9; padding: 4px 8px; border-radius: 4px; font-size: 12px;}
    .predikat-badge { font-weight: 700; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; display: inline-block; min-width: 30px; text-align: center; }
    .predikat-A { background: #2a9d8f; }
    .predikat-B { background: #3498db; }
    .predikat-C { background: #f39c12; }
    .predikat-D { background: #e74c3c; }
    
    .btn-cetak-orang { background: #9b59b6; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; }
    .btn-cetak-orang:hover { background: #8e44ad; }
    
    .loading { text-align: center; padding: 20px; color: #777; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyBjA8-_2it1AXMrEH7AcnprCasmKj0Mzmc",
      authDomain: "portal-irma-man-3-bogor.firebaseapp.com",
      projectId: "portal-irma-man-3-bogor",
      storageBucket: "portal-irma-man-3-bogor.firebasestorage.app",
      messagingSenderId: "582215464487",
      appId: "1:582215464487:web:4d0583016ebec700dec002"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let semuaDataSiswa = [];
    let dataTampilSekarang = []; 

    window.getPredikat = function(nilai) {
      if (nilai >= 85) return { huruf: 'A', class: 'predikat-A' };
      if (nilai >= 75) return { huruf: 'B', class: 'predikat-B' };
      if (nilai >= 65) return { huruf: 'C', class: 'predikat-C' };
      return { huruf: 'D', class: 'predikat-D' };
    }

    window.addEventListener("DOMContentLoaded", () => { muatDataAwal(); });

    async function muatDataAwal() {
      const container = document.getElementById("tabelNilaiBody");
      container.innerHTML = `<tr><td colspan="10" class="loading">Memuat data siswa...</td></tr>`;
      
      try {
        const snapSiswa = await getDocs(collection(db, "biodata_siswa"));
        if (snapSiswa.empty) {
          container.innerHTML = `<tr><td colspan="10" class="loading">Belum ada data siswa.</td></tr>`;
          return;
        }

        semuaDataSiswa = [];
        for (const docSiswa of snapSiswa.docs) {
          const siswa = docSiswa.data();
          const siswaId = docSiswa.id;
          const nama = siswa.nama || siswa["Nama Lengkap"] || "-";
          const kelas = siswa.kelas || siswa.Kelas || "-";
          const nisn = siswa.nisn || siswa.nis || "-";
          
          // AMBIL FOTO: Prioritaskan fotoUrl (Base64) atau foto (URL)
          const foto = siswa.fotoUrl || siswa.foto || ""; 

          const nilaiRef = doc(db, "nilai_ekstrakurikuler", siswaId);
          const nilaiSnap = await getDoc(nilaiRef);
          let nilai = { kehadiran: 0, keaktifan: 0, tugas: 0, sikap: 0, nilaiAkhir: 0 };
          if (nilaiSnap.exists()) {
            nilai = { ...nilai, ...nilaiSnap.data() };
          }

          semuaDataSiswa.push({
            id: siswaId, nama: nama, kelas: kelas, nisn: nisn, foto: foto, nilai: nilai
          });
        }

        isiDropdownKelas();
        filterTabel();

      } catch (err) {
        console.error(err);
        container.innerHTML = `<tr><td colspan="10" class="loading" style="color:red;">Gagal memuat data.</td></tr>`;
      }
    }

    function isiDropdownKelas() {
      const select = document.getElementById("filterKelas");
      const daftarKelas = [...new Set(semuaDataSiswa.map(s => s.kelas))].sort();
      let html = `<option value="semua">-- Tampilkan Semua Kelas --</option>`;
      daftarKelas.forEach(k => { html += `<option value="${k}">Kelas ${k}</option>`; });
      select.innerHTML = html;
    }

    window.filterTabel = function() {
      const kelasDipilih = document.getElementById("filterKelas").value;
      if (kelasDipilih === "semua") {
        dataTampilSekarang = semuaDataSiswa;
      } else {
        dataTampilSekarang = semuaDataSiswa.filter(s => s.kelas === kelasDipilih);
      }
      renderTabel(dataTampilSekarang);
    }

    function renderTabel(dataArray) {
      const container = document.getElementById("tabelNilaiBody");
      if (dataArray.length === 0) {
        container.innerHTML = `<tr><td colspan="10" class="loading">Tidak ada siswa di kelas ini.</td></tr>`;
        return;
      }

      let html = "";
      let no = 1;
      
      dataArray.forEach(s => {
        const siswaId = s.id;
        const nilai = s.nilai;
        const nAngka = parseFloat(nilai.nilaiAkhir || 0).toFixed(1);
        const predikat = window.getPredikat(parseFloat(nAngka));

        html += `
          <tr>
            <td class="text-center">${no++}</td>
            <td><strong>${s.nama}</strong><br><span style="font-size:10px; color:#777;">NISN: ${s.nisn}</span></td>
            <td class="text-center">${s.kelas}</td>
            <td class="text-center"><input type="number" min="0" max="100" id="hadir_${siswaId}" value="${nilai.kehadiran || ''}" placeholder="0" oninput="hitungNilai('${siswaId}')"></td>
            <td class="text-center"><input type="number" min="0" max="100" id="aktif_${siswaId}" value="${nilai.keaktifan || ''}" placeholder="0" oninput="hitungNilai('${siswaId}')"></td>
            <td class="text-center"><input type="number" min="0" max="100" id="tugas_${siswaId}" value="${nilai.tugas || ''}" placeholder="0" oninput="hitungNilai('${siswaId}')"></td>
            <td class="text-center"><input type="number" min="0" max="100" id="sikap_${siswaId}" value="${nilai.sikap || ''}" placeholder="0" oninput="hitungNilai('${siswaId}')"></td>
            <td class="text-center"><span class="nilai-akhir" id="akhir_${siswaId}">${nAngka}</span></td>
            <td class="text-center"><span class="predikat-badge ${predikat.class}" id="predikat_${siswaId}">${predikat.huruf}</span></td>
            <td class="text-center"><button class="btn-cetak-orang" onclick="cetakRaporIndividu('${siswaId}')">🖨️ Cetak</button></td>
          </tr>
        `;
      });
      container.innerHTML = html;
    }

    window.hitungNilai = function(siswaId) {
      const hadir = parseFloat(document.getElementById(`hadir_${siswaId}`).value) || 0;
      const aktif = parseFloat(document.getElementById(`aktif_${siswaId}`).value) || 0;
      const tugas = parseFloat(document.getElementById(`tugas_${siswaId}`).value) || 0;
      const sikap = parseFloat(document.getElementById(`sikap_${siswaId}`).value) || 0;

      const nilaiAkhir = ((hadir * 0.3) + (aktif * 0.3) + (tugas * 0.2) + (sikap * 0.2)).toFixed(1);
      document.getElementById(`akhir_${siswaId}`).innerText = nilaiAkhir;
      
      const predikat = window.getPredikat(parseFloat(nilaiAkhir));
      const elPredikat = document.getElementById(`predikat_${siswaId}`);
      elPredikat.innerText = predikat.huruf;
      elPredikat.className = `predikat-badge ${predikat.class}`;
    }

    window.simpanSemuaNilai = async function() {
      if (!confirm("💾 Simpan perubahan nilai untuk siswa yang tampil di tabel?")) return;
      
      const inputs = document.querySelectorAll("input[type='number']");
      let dataSimpan = {};

      inputs.forEach(inp => {
        const [komponen, siswaId] = inp.id.split('_');
        if (!dataSimpan[siswaId]) dataSimpan[siswaId] = {};
        let val = parseFloat(inp.value) || 0;
        if (val > 100) val = 100;
        if (val < 0) val = 0;
        dataSimpan[siswaId][komponen] = val;
      });

      try {
        for (const siswaId in dataSimpan) {
          const nilai = dataSimpan[siswaId];
          const nilaiAkhir = ((nilai.hadir * 0.3) + (nilai.aktif * 0.3) + (nilai.tugas * 0.2) + (nilai.sikap * 0.2)).toFixed(1);
          const predikat = window.getPredikat(parseFloat(nilaiAkhir));
          
          await setDoc(doc(db, "nilai_ekstrakurikuler", siswaId), {
            kehadiran: nilai.hadir, keaktifan: nilai.aktif, tugas: nilai.tugas, sikap: nilai.sikap,
            nilaiAkhir: parseFloat(nilaiAkhir), predikat: predikat.huruf, updatedAt: new Date().toISOString()
          }, { merge: true });
        }
        alert("✅ Semua nilai berhasil disimpan!");
      } catch (err) {
        alert("❌ Gagal menyimpan nilai: " + err.message);
      }
    }

    // ==========================================
    // FITUR CETAK
    // ==========================================

    window.cetakRaporIndividu = function(siswaId) {
      const siswa = semuaDataSiswa.find(s => s.id === siswaId);
      if (!siswa) return;

      const nilai = siswa.nilai;
      const nAngka = parseFloat(nilai.nilaiAkhir || 0).toFixed(1);
      const predikat = window.getPredikat(parseFloat(nAngka));
      const tanggalCetak = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      
      const motivasi = "Teruslah bersemangat dalam menuntut ilmu dan berorganisasi. Jadilah pribadi yang berakhlak mulia, disiplin, dan bermanfaat bagi agama, nusa, dan bangsa.";

      // LOGIKA FOTO: 
      // Jika ada foto (Base64 atau URL), gunakan itu. 
      // Jika tidak, gunakan avatar otomatis.
      let htmlFoto = "";
      if (siswa.foto && siswa.foto.length > 50) {
        // Tampilkan foto asli (Base64 atau URL panjang)
        htmlFoto = `<img src="${siswa.foto}" style="width:100%; height:100%; object-fit:cover;">`;
      } else {
        // Tampilkan avatar inisial nama
        htmlFoto = `<img src="https://ui-avatars.com/api/?name=${siswa.nama.replace(/ /g, '+')}&background=eee&color=aaa&size=200" style="width:100%; height:100%; object-fit:cover;">`;
      }

      const win = window.open('', '_blank');
      
      win.document.write(`
        <html>
        <head>
          <title>Rapor Ekstrakurikuler - ${siswa.nama}</title>
          <style>
            body { font-family: 'Times New Roman', Times, serif; padding: 30px; color: #000; }
            .kop-surat { text-align: center; border-bottom: 3px double #000; padding-bottom: 15px; margin-bottom: 20px; }
            .kop-surat h2 { margin: 0; font-size: 18px; }
            .kop-surat h3 { margin: 0; font-size: 16px; }
            .kop-surat p { margin: 5px 0 0; font-size: 12px; }
            .judul-rapor { text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 25px; text-decoration: underline; }
            
            .biodata-table { width: 100%; margin-bottom: 20px; font-size: 14px; }
            .biodata-table td { padding: 4px 0; vertical-align: top; }
            
            /* CSS FOTO DIPERBAIKI */
            .foto-box { width: 100px; height: 130px; border: 1px solid #000; float: right; overflow: hidden; background: #f0f0f0; }
            .foto-box img { width: 100%; height: 100%; object-fit: cover; }
            
            .nilai-table { width: 100%; border-collapse: collapse; margin-bottom: 25px; font-size: 14px; }
            .nilai-table th, .nilai-table td { border: 1px solid #000; padding: 10px; text-align: center; }
            .nilai-table th { background-color: #e0e0e0; }
            .nilai-table td.left { text-align: left; }
            
            .motivasi-box { border: 1px solid #000; padding: 15px; margin-bottom: 30px; font-size: 14px; font-style: italic; }
            
            .ttd-container { width: 100%; margin-top: 40px; font-size: 14px; }
            .ttd-kiri { float: left; width: 40%; text-align: center; }
            .ttd-kanan { float: right; width: 40%; text-align: center; }
            .ttd-space { height: 70px; }
            .clear { clear: both; }
          </style>
        </head>
        <body>
          
          <div class="kop-surat">
            <h2>MADRASAH ALIYAH NEGERI 3 BOGOR</h2>
            <h3>ORGANISASI IKTAN REMAJA MASJID (IRMA)</h3>
            <p>Jl. Rawagumbira No.39 Desa Sukamaju | Email: irma@man3bogor.sch.id</p>
          </div>

          <div class="judul-rapor">LAPORAN HASIL PENILAIAN EKSTRAKURIKULER</div>

          <!-- FOTO PROFIL DENGAN LOGIKA BARU -->
          <div class="foto-box">
            ${htmlFoto}
          </div>

          <table class="biodata-table">
            <tr><td style="width: 120px; font-weight: bold;">Nama Lengkap</td><td>: ${siswa.nama}</td></tr>
            <tr><td style="font-weight: bold;">NIS / NISN</td><td>: ${siswa.nisn}</td></tr>
            <tr><td style="font-weight: bold;">No. ID (UID)</td><td>: ${siswa.id}</td></tr>
            <tr><td style="font-weight: bold;">Kelas</td><td>: ${siswa.kelas}</td></tr>
            <tr><td style="font-weight: bold;">Ekstrakurikuler</td><td>: IRMA (Ikatan Remaja Masjid)</td></tr>
          </table>

          <div style="clear:both; margin-bottom: 20px;"></div>

          <table class="nilai-table">
            <thead>
              <tr>
                <th>No</th>
                <th>Komponen Penilaian</th>
                <th>Bobot</th>
                <th>Nilai Angka</th>
                <th>Predikat</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>1</td><td class="left">Kehadiran</td><td>30%</td><td>${nilai.kehadiran || 0}</td><td rowspan="4" style="font-size: 24px; font-weight: bold; vertical-align: middle;">${predikat.huruf}</td></tr>
              <tr><td>2</td><td class="left">Keaktifan</td><td>30%</td><td>${nilai.keaktifan || 0}</td></tr>
              <tr><td>3</td><td class="left">Tugas / Proyek</td><td>20%</td><td>${nilai.tugas || 0}</td></tr>
              <tr><td>4</td><td class="left">Sikap</td><td>20%</td><td>${nilai.sikap || 0}</td></tr>
              <tr style="background:#f0f0f0; font-weight:bold;">
                <td colspan="3">NILAI AKHIR</td>
                <td colspan="2">${nAngka}</td>
              </tr>
            </tbody>
          </table>

          <div class="motivasi-box">
            <strong>Motivasi Pembina:</strong><br><br>
            "${motivasi}"
          </div>

          <div class="ttd-container">
            <div class="ttd-kiri">
              Mengetahui,<br>
              Kepala Madrasah<br>
              <div class="ttd-space"></div>
              <strong><u>...............................</u></strong><br>
              NIP. .............................
            </div>
            <div class="ttd-kanan">
              Bogor, ${tanggalCetak}<br>
              Pembina IRMA<br>
              <div class="ttd-space"></div>
              <strong><u>...............................</u></strong><br>
              NIP. .............................
            </div>
            <div class="clear"></div>
          </div>

        </body>
        </html>
      `);
      
      win.document.close();
      setTimeout(() => { win.print(); }, 800); // Waktu tunggu ditambah agar Base64 termuat
    };

    window.cetakRekap = function() {
      if (dataTampilSekarang.length === 0) {
        alert("Tidak ada data untuk dicetak.");
        return;
      }

      const tanggalCetak = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      const judulKelas = document.getElementById("filterKelas").options[document.getElementById("filterKelas").selectedIndex].text;

      const win = window.open('', '_blank');
      
      let barisTabel = "";
      let no = 1;
      dataTampilSekarang.forEach(s => {
        const nilai = s.nilai;
        const nAngka = parseFloat(nilai.nilaiAkhir || 0).toFixed(1);
        const predikat = window.getPredikat(parseFloat(nAngka));
        
        barisTabel += `
          <tr>
            <td>${no++}</td>
            <td>${s.nisn}</td>
            <td class="left">${s.nama}</td>
            <td>${s.kelas}</td>
            <td>${nilai.kehadiran || 0}</td>
            <td>${nilai.keaktifan || 0}</td>
            <td>${nilai.tugas || 0}</td>
            <td>${nilai.sikap || 0}</td>
            <td><strong>${nAngka}</strong></td>
            <td><strong>${predikat.huruf}</strong></td>
          </tr>
        `;
      });

      win.document.write(`
        <html>
        <head>
          <title>Rekap Nilai Ekstrakurikuler</title>
          <style>
            body { font-family: Arial, sans-serif; padding: 20px; color: #000; }
            .kop-surat { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
            .kop-surat h2 { margin: 0; font-size: 16px; }
            .kop-surat h3 { margin: 0; font-size: 14px; }
            .judul { text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 15px; }
            
            table { width: 100%; border-collapse: collapse; font-size: 11px; }
            th, td { border: 1px solid #000; padding: 8px 5px; text-align: center; }
            th { background-color: #e0e0e0; }
            td.left { text-align: left; }
            
            .ttd-container { width: 100%; margin-top: 30px; font-size: 12px; }
            .ttd-kanan { float: right; width: 40%; text-align: center; }
            .ttd-space { height: 60px; }
          </style>
        </head>
        <body>
          
          <div class="kop-surat">
            <h2>MADRASAH ALIYAH NEGERI 3 BOGOR</h2>
            <h3>ORGANISASI IKTAN REMAJA MASJID (IRMA)</h3>
          </div>

          <div class="judul">REKAPITULASI NILAI EKSTRAKURIKULER IRMA<br>${judulKelas}</div>

          <table>
            <thead>
              <tr>
                <th style="width:30px;">No</th>
                <th>NISN</th>
                <th>Nama Siswa</th>
                <th>Kelas</th>
                <th>Kehadiran</th>
                <th>Keaktifan</th>
                <th>Tugas</th>
                <th>Sikap</th>
                <th>Nilai</th>
                <th>Predikat</th>
              </tr>
            </thead>
            <tbody>
              ${barisTabel}
            </tbody>
          </table>

          <div class="ttd-container">
            <div class="ttd-kanan">
              Bogor, ${tanggalCetak}<br>
              Pembina IRMA<br>
