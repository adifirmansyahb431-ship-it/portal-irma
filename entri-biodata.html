<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entri Biodata Siswa - Portal IRMA</title>
  <style>
    :root {
      --primary-color: #0a3622;
      --accent-color: #d4af37;
      --bg-color: #f4f7f6;
      --text-color: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: var(--text-color);
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 15px;
    }

    .header h2 { color: var(--primary-color); margin: 0; }
    .header p { color: #666; margin-top: 5px; }

    /* LAYOUT KIRI (FOTO) DAN KANAN (FORM) */
    .form-layout {
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    /* --- DESAIN KOTAK FOTO BARU --- */
    .foto-section {
      width: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f9f9f9;
      padding: 15px;
      border-radius: 10px;
      border: 1px dashed #ccc;
    }

    .foto-box {
      width: 120px;
      height: 160px; /* Rasio pas foto 3x4 */
      border-radius: 8px;
      background-color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 2px solid var(--primary-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }

    .foto-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .foto-box span {
      color: #888;
      font-size: 12px;
      text-align: center;
      padding: 10px;
    }

    .btn-upload-label {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      width: 100%;
      text-align: center;
      transition: 0.3s;
      box-sizing: border-box;
    }

    .btn-upload-label:hover { background-color: #072517; }
    
    input[type="file"] { display: none; }

    .info-upload {
      font-size: 10px;
      color: #777;
      text-align: center;
      margin-top: 8px;
      line-height: 1.3;
    }
    /* ------------------------------ */

    /* FORM DATA KANAN */
    .data-section {
      flex: 1;
    }

    .form-group { margin-bottom: 15px; }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--primary-color);
      font-size: 14px;
    }

    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group input[type="date"],
    .form-group input[type="tel"],
    .form-group input[type="email"],
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: inherit;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 5px rgba(10, 54, 34, 0.2);
    }

    .form-row { display: flex; gap: 15px; }
    .form-row .form-group { flex: 1; }

    .btn-submit {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s ease;
      margin-top: 10px;
    }

    .btn-submit:hover { background-color: #072517; }

    .alert-success {
      display: none;
      background-color: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      border: 1px solid #c3e6cb;
    }

    /* RESPONSIF (Tampilan HP) */
    @media (max-width: 650px) {
      .form-layout { flex-direction: column; align-items: center; }
      .foto-section { width: 100%; max-width: 200px; margin-bottom: 20px; }
      .data-section { width: 100%; }
      .form-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>📝 Entri Biodata Siswa</h2>
      <p>Lengkapi data diri Anda untuk keanggotaan IRMA MAN 3 Bogor</p>
    </div>

    <div id="successMessage" class="alert-success">
      Biodata berhasil disimpan! Terima kasih telah melengkapi data.
    </div>

    <form id="formBiodata" onsubmit="simpanBiodata(event)">
      
      <div class="form-layout">
        
        <!-- SISI KIRI: FOTO & TOMBOL UPLOAD -->
        <div class="foto-section">
          <div class="foto-box" id="fotoBox">
            <!-- Gambar preview akan muncul di sini -->
            <img id="previewFoto" src="" alt="Preview" style="display: none;">
            <span id="textPlaceholder">Belum ada foto</span>
          </div>
          
          <!-- Tombol upload terpisah di bawah foto -->
          <label for="foto" class="btn-upload-label">📷 Pilih Foto</label>
          <input type="file" id="foto" name="foto" accept="image/jpeg, image/png" onchange="tampilkanPreview(event)">
          
          <div class="info-upload">Format: JPG/PNG<br>Wajah terlihat jelas</div>
        </div>

        <!-- SISI KANAN: DATA DIRI -->
        <div class="data-section">
          
          <div class="form-row">
            <div class="form-group">
              <label for="nis">NIS</label>
              <input type="number" id="nis" name="nis" placeholder="Masukkan NIS" required>
            </div>
            <div class="form-group">
              <label for="nama">Nama Lengkap</label>
              <input type="text" id="nama" name="nama" placeholder="Nama Lengkap" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="kelas">Kelas</label>
              <select id="kelas" name="kelas" required>
                <option value="">-- Pilih Kelas --</option>
                <option value="10">Kelas 10</option>
                <option value="11">Kelas 11</option>
                <option value="12">Kelas 12</option>
              </select>
            </div>
            <div class="form-group">
              <label for="jurusan">Jurusan</label>
              <select id="jurusan" name="jurusan" required>
                <option value="">-- Pilih Jurusan --</option>
                <option value="MIPA">MIPA</option>
                <option value="IPS">IPS</option>
                <option value="Keagamaan">Keagamaan</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="tempatLahir">Tempat Lahir</label>
              <input type="text" id="tempatLahir" name="tempatLahir" placeholder="Contoh: Bogor" required>
            </div>
            <div class="form-group">
              <label for="tanggalLahir">Tanggal Lahir</label>
              <input type="date" id="tanggalLahir" name="tanggalLahir" required>
            </div>
          </div>

          <div class="form-group">
            <label for="noHp">Nomor WhatsApp</label>
            <input type="tel" id="noHp" name="noHp" placeholder="Contoh: 08123456789" required>
          </div>

          <div class="form-group">
            <label for="alamat">Alamat Lengkap</label>
            <textarea id="alamat" name="alamat" rows="2" placeholder="Tuliskan alamat lengkap" required></textarea>
          </div>

        </div>
      </div>

      <button type="submit" class="btn-submit">Simpan Biodata</button>
    </form>
  </div>

  <script>
    // Fungsi Preview Foto
    function tampilkanPreview(event) {
      const input = event.target;
      const reader = new FileReader();
      
      reader.onload = function(){
        const dataURL = reader.result;
        const imgPreview = document.getElementById('previewFoto');
        const textPlaceholder = document.getElementById('textPlaceholder');
        
        imgPreview.src = dataURL;
        imgPreview.style.display = 'block'; // Tampilkan gambar
        textPlaceholder.style.display = 'none'; // Sembunyikan teks "Belum ada foto"
      };
      
      if (input.files && input.files[0]) {
        reader.readAsDataURL(input.files[0]);
      }
    }

    function simpanBiodata(event) {
      event.preventDefault(); 
      
      const form = document.getElementById('formBiodata');
      const data = new FormData(form);
      
      console.log("Data yang disubmit:");
      for (let [key, value] of data.entries()) {
        if(value instanceof File) {
            console.log(`${key}: [File] ${value.name}`);
        } else {
            console.log(`${key}: ${value}`);
        }
      }

      const successMsg = document.getElementById('successMessage');
      successMsg.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      setTimeout(() => {
        successMsg.style.display = 'none';
      }, 5000);
    }
  </script>

</body>
</html>
