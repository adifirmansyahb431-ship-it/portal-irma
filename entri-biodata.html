<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biodata Siswa - Portal IRMA</title>
  <style>
    :root {
      --primary-color: #0a3622;
      --accent-color: #d4af37;
      --bg-color: #f4f7f6;
      --text-color: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: var(--text-color);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin-bottom: 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 15px;
    }

    .header h2 {
      color: var(--primary-color);
      margin: 0;
    }

    .header p {
      color: #666;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--primary-color);
    }

    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group input[type="date"],
    .form-group input[type="tel"],
    .form-group input[type="email"],
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 5px rgba(10, 54, 34, 0.2);
    }

    .form-row {
      display: flex;
      gap: 20px;
    }

    .form-row .form-group {
      flex: 1;
    }

    /* --- CSS UNTUK UPLOAD FOTO --- */
    .upload-foto-area {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #f9f9f9;
      padding: 15px;
      border: 2px dashed #ccc;
      border-radius: 8px;
      transition: 0.3s;
    }

    .upload-foto-area:hover {
      border-color: var(--primary-color);
    }

    .preview-foto {
      width: 90px;
      height: 120px;
      border-radius: 6px;
      background-color: #e0e0e0;
      object-fit: cover;
      border: 1px solid #ddd;
    }

    .upload-info {
      flex: 1;
    }

    .upload-info p {
      margin: 0 0 10px 0;
      font-size: 12px;
      color: #777;
    }

    .btn-upload {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: inline-block;
    }

    /* Sembunyikan input file asli */
    input[type="file"] {
      display: none;
    }
    /* ----------------------------- */

    .btn-submit {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s ease;
    }

    .btn-submit:hover {
      background-color: #072517;
    }

    .alert-success {
      display: none;
      background-color: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      border: 1px solid #c3e6cb;
    }

    /* Responsif untuk layar HP */
    @media (max-width: 600px) {
      .form-row {
        flex-direction: column;
        gap: 0;
      }
      .container {
        padding: 20px;
      }
      .upload-foto-area {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>📝 Entri Biodata Siswa</h2>
      <p>Lengkapi data diri Anda untuk keanggotaan IRMA MAN 3 Bogor</p>
    </div>

    <div id="successMessage" class="alert-success">
      Biodata berhasil disimpan! Terima kasih telah melengkapi data.
    </div>

    <form id="formBiodata" onsubmit="simpanBiodata(event)">
      
      <!-- BAGIAN UPLOAD FOTO -->
      <div class="form-group">
        <label>Foto Anggota (Format: JPG/PNG)</label>
        <div class="upload-foto-area">
          <img id="previewFoto" class="preview-foto" src="https://via.placeholder.com/90x120?text=Foto" alt="Preview Foto">
          <div class="upload-info">
            <p>Pastikan foto formal, berpakaian rapi, dan wajah terlihat jelas.</p>
            <label for="foto" class="btn-upload">Pilih Foto</label>
            <input type="file" id="foto" name="foto" accept="image/jpeg, image/png" onchange="tampilkanPreview(event)">
          </div>
        </div>
      </div>
      <!-- ------------------ -->

      <div class="form-row">
        <div class="form-group">
          <label for="nis">NIS (Nomor Induk Siswa)</label>
          <input type="number" id="nis" name="nis" placeholder="Masukkan NIS Anda" required>
        </div>
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan Nama Lengkap" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="kelas">Kelas</label>
          <select id="kelas" name="kelas" required>
            <option value="">-- Pilih Kelas --</option>
            <option value="10">Kelas 10</option>
            <option value="11">Kelas 11</option>
            <option value="12">Kelas 12</option>
          </select>
        </div>
        <div class="form-group">
          <label for="jurusan">Jurusan</label>
          <select id="jurusan" name="jurusan" required>
            <option value="">-- Pilih Jurusan --</option>
            <option value="MIPA">MIPA</option>
            <option value="IPS">IPS</option>
            <option value="Keagamaan">Keagamaan</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="tempatLahir">Tempat Lahir</label>
          <input type="text" id="tempatLahir" name="tempatLahir" placeholder="Contoh: Bogor" required>
        </div>
        <div class="form-group">
          <label for="tanggalLahir">Tanggal Lahir</label>
          <input type="date" id="tanggalLahir" name="tanggalLahir" required>
        </div>
      </div>

      <div class="form-group">
        <label for="alamat">Alamat Lengkap</label>
        <textarea id="alamat" name="alamat" rows="3" placeholder="Tuliskan alamat lengkap (RT/RW, Desa, Kecamatan, Kabupaten)" required></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="noHp">Nomor WhatsApp</label>
          <input type="tel" id="noHp" name="noHp" placeholder="Contoh: 08123456789" required>
        </div>
        <div class="form-group">
          <label for="email">Email (Opsional)</label>
          <input type="email" id="email" name="email" placeholder="Contoh: siswa@email.com">
        </div>
      </div>

      <div class="form-group">
        <label for="alasan">Alasan Bergabung dengan IRMA</label>
        <textarea id="alasan" name="alasan" rows="2" placeholder="Ceritakan singkat mengapa Anda ingin bergabung..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">Simpan Biodata</button>
    </form>
  </div>

  <script>
    // Fungsi untuk menampilkan preview foto saat file dipilih
    function tampilkanPreview(event) {
      const input = event.target;
      const reader = new FileReader();
      
      reader.onload = function(){
        const dataURL = reader.result;
        const output = document.getElementById('previewFoto');
        output.src = dataURL;
      };
      
      if (input.files && input.files[0]) {
        reader.readAsDataURL(input.files[0]);
      }
    }

    function simpanBiodata(event) {
      event.preventDefault(); // Mencegah form agar tidak reload halaman
      
      const form = document.getElementById('formBiodata');
      const data = new FormData(form);
      
      // Simulasi proses penyimpanan
      console.log("Data yang disubmit:");
      for (let [key, value] of data.entries()) {
        // Jika yang di-log adalah objek File (foto), tampilkan nama filenya saja
        if(value instanceof File) {
            console.log(`${key}: [File] ${value.name}`);
        } else {
            console.log(`${key}: ${value}`);
        }
      }

      // Menampilkan pesan sukses
      const successMsg = document.getElementById('successMessage');
      successMsg.style.display = 'block';
      
      // Scroll ke atas agar pesan sukses terlihat
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // (Opsional) Reset form setelah disubmit
      // form.reset();
      // document.getElementById('previewFoto').src = "https://via.placeholder.com/90x120?text=Foto";

      // Sembunyikan pesan setelah 5 detik
      setTimeout(() => {
        successMsg.style.display = 'none';
      }, 5000);
    }
  </script>

</body>
</html>
