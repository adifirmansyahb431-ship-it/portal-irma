<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entri Biodata Siswa - Portal IRMA</title>
  <style>
    :root {
      --primary-color: #0a3622;
      --accent-color: #d4af37;
      --bg-color: #f4f7f6;
      --text-color: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: var(--text-color);
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 15px;
    }

    .header h2 { color: var(--primary-color); margin: 0; }
    .header p { color: #666; margin-top: 5px; }

    .form-layout {
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    /* --- DESAIN KOTAK FOTO --- */
    .foto-section {
      width: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f9f9f9;
      padding: 15px;
      border-radius: 10px;
      border: 1px dashed #ccc;
    }

    .foto-box {
      width: 120px;
      height: 160px;
      border-radius: 8px;
      background-color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 2px solid var(--primary-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }

    .foto-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .foto-box span {
      color: #888;
      font-size: 12px;
      text-align: center;
      padding: 10px;
    }

    .btn-upload-label {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      width: 100%;
      text-align: center;
      transition: 0.3s;
      box-sizing: border-box;
      display: block;
    }

    .btn-upload-label:hover { background-color: #072517; }
    input[type="file"] { display: none; }

    /* FORM DATA KANAN */
    .data-section { flex: 1; }

    .form-group { margin-bottom: 15px; }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--primary-color);
      font-size: 14px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: inherit;
    }

    .form-group input:disabled, 
    .form-group select:disabled, 
    .form-group textarea:disabled {
      background-color: #f0f0f0;
      color: #555;
      cursor: not-allowed;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 5px rgba(10, 54, 34, 0.2);
    }

    .form-row { display: flex; gap: 15px; }
    .form-row .form-group { flex: 1; }

    .btn-submit {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s ease;
      margin-top: 10px;
    }

    .btn-submit:hover { background-color: #072517; }
    .btn-edit { background-color: var(--accent-color); display: none; }
    
    .alert {
      display: none; padding: 15px; border-radius: 6px; margin-bottom: 20px; font-size: 14px;
    }
    .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    @media (max-width: 650px) {
      .form-layout { flex-direction: column; align-items: center; }
      .foto-section { width: 100%; max-width: 200px; margin-bottom: 20px; }
      .data-section { width: 100%; }
      .form-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>📝 Entri Biodata Siswa</h2>
      <p>Lengkapi data diri Anda untuk keanggotaan IRMA MAN 3 Bogor</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="formBiodata" onsubmit="simpanBiodata(event)">
      
      <div class="form-layout">
        
        <!-- SISI KIRI: FOTO -->
        <div class="foto-section">
          <div class="foto-box" id="fotoBox">
            <img id="previewFoto" src="" alt="Preview" style="display: none;">
            <span id="textPlaceholder">Belum ada foto</span>
          </div>
          <label for="foto" class="btn-upload-label" id="labelUpload">📷 Pilih Foto</label>
          <input type="file" id="foto" accept="image/jpeg, image/png" onchange="tampilkanPreview(event)">
        </div>

        <!-- SISI KANAN: DATA DIRI -->
        <div class="data-section">
          <div class="form-row">
            <div class="form-group">
              <label for="nis">NIS</label>
              <input type="number" id="nis" name="nis" placeholder="Masukkan NIS" required>
            </div>
            <div class="form-group">
              <label for="nama">Nama Lengkap</label>
              <input type="text" id="nama" name="nama" placeholder="Nama Lengkap" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="kelas">Kelas</label>
              <select id="kelas" name="kelas" required>
                <option value="">-- Pilih Kelas --</option>
                <option value="10">Kelas 10</option>
                <option value="11">Kelas 11</option>
                <option value="12">Kelas 12</option>
              </select>
            </div>
            <div class="form-group">
              <label for="jurusan">Jurusan</label>
              <select id="jurusan" name="jurusan" required>
                <option value="">-- Pilih Jurusan --</option>
                <option value="MIPA">MIPA</option>
                <option value="IPS">IPS</option>
                <option value="Keagamaan">Keagamaan</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="tempatLahir">Tempat Lahir</label>
              <input type="text" id="tempatLahir" name="tempatLahir" placeholder="Contoh: Bogor" required>
            </div>
            <div class="form-group">
              <label for="tanggalLahir">Tanggal Lahir</label>
              <input type="date" id="tanggalLahir" name="tanggalLahir" required>
            </div>
          </div>
          <div class="form-group">
            <label for="noHp">Nomor WhatsApp</label>
            <input type="tel" id="noHp" name="noHp" placeholder="Contoh: 08123456789" required>
          </div>
          <div class="form-group">
            <label for="alamat">Alamat Lengkap</label>
            <textarea id="alamat" name="alamat" rows="2" placeholder="Tuliskan alamat lengkap" required></textarea>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSimpan">Simpan Biodata</button>
      <button type="button" class="btn-submit btn-edit" id="btnEdit" onclick="aktifkanEdit()">✏️ Edit Biodata</button>
    </form>
  </div>

  <!-- IMPORT FIREBASE SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // KONFIGURASI FIREBASE (SESUAI GAMBAR ANDA)
    const firebaseConfig = {
      apiKey: "AIzaSyBjA8--2it1AXMrEH7AcnprCasmKj0Mzrrc",
      authDomain: "portal-irma-man-3-bogor.firebaseapp.com",
      projectId: "portal-irma-man-3-bogor",
      storageBucket: "portal-irma-man-3-bogor.firebasestorage.app",
      messagingSenderId: "582215464487",
      appId: "1:582215464487:web:4d0583016ebec700dec092"
    };

    // KONFIGURASI IMGBB
    const IMGBB_API_KEY = "cfe87fa0c5c5467b0ea481926f11e4b5";

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let fileFotoBaru = null; 
    let fotoUrlLama = ""; // Menyimpan URL foto lama jika siswa tidak ganti foto

    // Cek User Login
        // === JALAN PINTAS UNTUK UJI COBA (BYPASS LOGIN) ===
    // Karena sistem login asli belum terhubung ke Firebase Auth
    currentUser = { uid: "siswa_tes_123", email: "siswa@irma.com" };
    ambilDataSiswa(currentUser.uid);
    // ==================================================

    // Ambil Data dari Firestore
    async function ambilDataSiswa(uid) {
      try {
        const docRef = doc(db, "biodata_siswa", uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          
          document.getElementById('nis').value = data.nis || '';
          document.getElementById('nama').value = data.nama || '';
          document.getElementById('kelas').value = data.kelas || '';
          document.getElementById('jurusan').value = data.jurusan || '';
          document.getElementById('tempatLahir').value = data.tempatLahir || '';
          document.getElementById('tanggalLahir').value = data.tanggalLahir || '';
          document.getElementById('noHp').value = data.noHp || '';
          document.getElementById('alamat').value = data.alamat || '';

          if (data.fotoUrl) {
            fotoUrlLama = data.fotoUrl;
            document.getElementById('previewFoto').src = data.fotoUrl;
            document.getElementById('previewFoto').style.display = 'block';
            document.getElementById('textPlaceholder').style.display = 'none';
          }

          kunciForm(); 
        }
      } catch (error) {
        console.error("Error mengambil data:", error);
      }
    }

    // Preview Foto Lokal
    window.tampilkanPreview = function(event) {
      const input = event.target;
      if (input.files && input.files[0]) {
        fileFotoBaru = input.files[0];
        
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('previewFoto').src = e.target.result;
          document.getElementById('previewFoto').style.display = 'block';
          document.getElementById('textPlaceholder').style.display = 'none';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // Upload ke ImgBB
    async function uploadKeImgBB(file) {
      const formData = new FormData();
      formData.append('image', file);

      const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: 'POST',
        body: formData
      });

      const result = await response.json();
      if (result.success) {
        return result.data.url; // Mengembalikan Link URL Gambar
      } else {
        throw new Error("Gagal upload gambar ke ImgBB");
      }
    }

    // Simpan Biodata
    window.simpanBiodata = async function(event) {
      event.preventDefault();
      if (!currentUser) return;

      const btnSimpan = document.getElementById('btnSimpan');
      btnSimpan.innerText = "Menyimpan...";
      btnSimpan.disabled = true;

      try {
        let fotoUrlFinal = fotoUrlLama;

        // Jika siswa memilih foto baru, upload ke ImgBB
        if (fileFotoBaru) {
          btnSimpan.innerText = "Mengunggah Foto...";
          fotoUrlFinal = await uploadKeImgBB(fileFotoBaru);
        }

        btnSimpan.innerText = "Menyimpan Data...";

        const dataSiswa = {
          nis: document.getElementById('nis').value,
          nama: document.getElementById('nama').value,
          kelas: document.getElementById('kelas').value,
          jurusan: document.getElementById('jurusan').value,
          tempatLahir: document.getElementById('tempatLahir').value,
          tanggalLahir: document.getElementById('tanggalLahir').value,
          noHp: document.getElementById('noHp').value,
          alamat: document.getElementById('alamat').value,
          email: currentUser.email,
          fotoUrl: fotoUrlFinal,
          updatedAt: new Date().toISOString()
        };

        // Simpan ke Firestore
        await setDoc(doc(db, "biodata_siswa", currentUser.uid), dataSiswa);

        fotoUrlLama = fotoUrlFinal; // Update URL foto lama
        fileFotoBaru = null; // Reset file baru

        tampilkanAlert("Biodata dan Foto berhasil disimpan!", "success");
        kunciForm();

      } catch (error) {
        console.error("Error menyimpan:", error);
        tampilkanAlert("Gagal menyimpan data: " + error.message, "danger");
      } finally {
        btnSimpan.innerText = "Simpan Biodata";
        btnSimpan.disabled = false;
      }
    }

    // Kunci Form
    function kunciForm() {
      document.querySelectorAll('#formBiodata input, #formBiodata select, #formBiodata textarea').forEach(el => el.disabled = true);
      document.getElementById('labelUpload').style.display = 'none';
      document.getElementById('btnSimpan').style.display = 'none';
      document.getElementById('btnEdit').style.display = 'block';
    }

    // Buka Kunci Form
    window.aktifkanEdit = function() {
      document.querySelectorAll('#formBiodata input, #formBiodata select, #formBiodata textarea').forEach(el => el.disabled = false);
      document.getElementById('labelUpload').style.display = 'block';
      document.getElementById('btnSimpan').style.display = 'block';
      document.getElementById('btnEdit').style.display = 'none';
    }

    // Tampilkan Alert
    function tampilkanAlert(pesan, tipe) {
      const alertBox = document.getElementById('alertBox');
      alertBox.innerHTML = pesan;
      alertBox.className = `alert alert-${tipe}`;
      alertBox.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => { alertBox.style.display = 'none'; }, 5000);
    }
  </script>

</body>
</html>
