<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entri Biodata Siswa - Portal IRMA</title>
  <style>
    :root { --primary-color: #0a3622; --accent-color: #d4af37; --bg-color: #f4f7f6; --text-color: #333; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: var(--text-color); }
    .container { max-width: 850px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
    .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--primary-color); padding-bottom: 15px; }
    .header h2 { color: var(--primary-color); margin: 0; }
    .header p { color: #666; margin-top: 5px; }
    .form-layout { display: flex; gap: 30px; align-items: flex-start; }
    
    .foto-section { width: 160px; display: flex; flex-direction: column; align-items: center; background: #f9f9f9; padding: 15px; border-radius: 10px; border: 1px dashed #ccc; }
    .foto-box { width: 120px; height: 160px; border-radius: 8px; background-color: #e0e0e0; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 2px solid var(--primary-color); box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    .foto-box img { width: 100%; height: 100%; object-fit: cover; }
    .foto-box span { color: #888; font-size: 12px; text-align: center; padding: 10px; }
    .btn-upload-label { background-color: var(--primary-color); color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 600; width: 100%; text-align: center; transition: 0.3s; box-sizing: border-box; display: block; }
    .btn-upload-label:hover { background-color: #072517; }
    input[type="file"] { display: none; }
    
    .data-section { flex: 1; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: var(--primary-color); font-size: 14px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
    .form-group input:disabled, .form-group select:disabled, .form-group textarea:disabled { background-color: #f0f0f0; color: #555; cursor: not-allowed; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 5px rgba(10, 54, 34, 0.2); }
    .form-row { display: flex; gap: 15px; }
    .form-row .form-group { flex: 1; }
    .btn-submit { background-color: var(--primary-color); color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background-color 0.3s ease; margin-top: 10px; }
    .btn-submit:hover { background-color: #072517; }
    .btn-edit { background-color: var(--accent-color); display: none; }
    
    .alert { display: none; padding: 15px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; }
    .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    @media (max-width: 650px) {
      .form-layout { flex-direction: column; align-items: center; }
      .foto-section { width: 100%; max-width: 200px; margin-bottom: 20px; }
      .data-section { width: 100%; }
      .form-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>📝 Entri Biodata Siswa</h2>
      <p>Lengkapi data diri Anda untuk keanggotaan IRMA MAN 3 Bogor</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="formBiodata" onsubmit="window.simpanBiodata(event)">
      <div class="form-layout">
        
        <div class="foto-section">
          <div class="foto-box" id="fotoBox">
            <img id="previewFoto" src="" alt="Preview" style="display: none;">
            <span id="textPlaceholder">Belum ada foto</span>
          </div>
          <label for="foto" class="btn-upload-label" id="labelUpload">📷 Pilih Foto</label>
          <input type="file" id="foto" accept="image/jpeg, image/png" onchange="window.tampilkanPreview(event)">
        </div>

        <div class="data-section">
          <div class="form-row">
            <div class="form-group">
              <label for="nis">NIS</label>
              <input type="number" id="nis" name="nis" placeholder="Masukkan NIS" required>
            </div>
            <div class="form-group">
              <label for="nama">Nama Lengkap</label>
              <input type="text" id="nama" name="nama" placeholder="Nama Lengkap" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="kelas">Kelas</label>
              <select id="kelas" name="kelas" required>
                <option value="">-- Pilih Kelas --</option>
                <option value="10">Kelas 10</option>
                <option value="11">Kelas 11</option>
                <option value="12">Kelas 12</option>
              </select>
            </div>
            <div class="form-group">
              <label for="jurusan">Jurusan</label>
              <select id="jurusan" name="jurusan" required>
                <option value="">-- Pilih Jurusan --</option>
                <option value="MIPA">MIPA</option>
                <option value="IPS">IPS</option>
                <option value="Keagamaan">Keagamaan</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="tempatLahir">Tempat Lahir</label>
              <input type="text" id="tempatLahir" name="tempatLahir" placeholder="Contoh: Bogor" required>
            </div>
            <div class="form-group">
              <label for="tanggalLahir">Tanggal Lahir</label>
              <input type="date" id="tanggalLahir" name="tanggalLahir" required>
            </div>
          </div>
          <div class="form-group">
            <label for="noHp">Nomor WhatsApp Siswa</label>
            <input type="tel" id="noHp" name="noHp" placeholder="Contoh: 08123456789" required>
          </div>
          
          <!-- TAMBAHAN DATA ORANG TUA -->
          <div class="form-row">
            <div class="form-group">
              <label for="namaOrtu">Nama Orang Tua / Wali</label>
              <input type="text" id="namaOrtu" name="namaOrtu" placeholder="Nama Orang Tua">
            </div>
            <div class="form-group">
              <label for="noHpOrtu">No. HP Orang Tua</label>
              <input type="tel" id="noHpOrtu" name="noHpOrtu" placeholder="08xxxx">
            </div>
          </div>
          <!-- ------------------------- -->

          <div class="form-group">
            <label for="alamat">Alamat Lengkap</label>
            <textarea id="alamat" name="alamat" rows="2" placeholder="Tuliskan alamat lengkap" required></textarea>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSimpan">Simpan Biodata</button>
      <button type="button" class="btn-submit btn-edit" id="btnEdit" onclick="window.aktifkanEdit()">✏️ Edit Biodata</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjA8-_2it1AXMrEH7AcnprCasmKj0Mzmc",
      authDomain: "portal-irma-man-3-bogor.firebaseapp.com",
      projectId: "portal-irma-man-3-bogor",
      storageBucket: "portal-irma-man-3-bogor.firebasestorage.app",
      messagingSenderId: "582215464487",
      appId: "1:582215464487:web:4d0583016ebec700dec002"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUserUid = null;
    let fileFotoBaru = null; 
    let fotoUrlLama = ""; 

    const urlParams = new URLSearchParams(window.location.search);
    const uidFromUrl = urlParams.get('uid');

    if (uidFromUrl) {
      currentUserUid = uidFromUrl;
      document.getElementById('alertBox').style.display = 'none';
      document.getElementById('btnSimpan').disabled = false;
      ambilDataSiswa(currentUserUid);
    } else {
      tampilkanAlert("Sesi login tidak ditemukan. Silakan buka melalui Beranda.", "danger");
      document.getElementById('btnSimpan').disabled = true;
    }

    async function ambilDataSiswa(uid) {
      try {
        const docRef = doc(db, "biodata_siswa", uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          
          document.getElementById('nis').value = data.nis || '';
          document.getElementById('nama').value = data.nama || '';
          document.getElementById('kelas').value = data.kelas || '';
          document.getElementById('jurusan').value = data.jurusan || '';
          document.getElementById('tempatLahir').value = data.tempatLahir || '';
          document.getElementById('tanggalLahir').value = data.tanggalLahir || '';
          document.getElementById('noHp').value = data.noHp || '';
          document.getElementById('namaOrtu').value = data.namaOrtu || '';
          document.getElementById('noHpOrtu').value = data.noHpOrtu || '';
          document.getElementById('alamat').value = data.alamat || '';

          const img = document.getElementById('previewFoto');
          const placeholder = document.getElementById('textPlaceholder');

          if (data.fotoUrl && data.fotoUrl.startsWith('data:image')) {
            fotoUrlLama = data.fotoUrl;
            img.src = data.fotoUrl;
            img.style.display = 'block';
            placeholder.style.display = 'none';
          } else {
            const namaSiswa = data.nama || "Siswa";
            const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(namaSiswa)}&background=0a3622&color=fff&size=150`;
            img.src = avatarUrl;
            img.style.display = 'block';
            placeholder.style.display = 'none';
          }

          kunciForm(); 
        }
      } catch (error) {
        console.error("Error mengambil data:", error);
        tampilkanAlert("Gagal memuat data dari database.", "danger");
      }
    }

    window.tampilkanPreview = function(event) {
      const input = event.target;
      if (input.files && input.files[0]) {
        fileFotoBaru = input.files[0];
        
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById('previewFoto');
          img.src = e.target.result;
          img.style.display = 'block';
          document.getElementById('textPlaceholder').style.display = 'none';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    window.simpanBiodata = async function(event) {
      event.preventDefault();
      if (!currentUserUid) return;

      const btnSimpan = document.getElementById('btnSimpan');
      btnSimpan.innerText = "Menyimpan...";
      btnSimpan.disabled = true;

      try {
        let fotoUrlFinal = fotoUrlLama;

        if (fileFotoBaru) {
          fotoUrlFinal = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(fileFotoBaru);
          });
        }

        const dataSiswa = {
          nis: document.getElementById('nis').value,
          nama: document.getElementById('nama').value,
          kelas: document.getElementById('kelas').value,
          jurusan: document.getElementById('jurusan').value,
          tempatLahir: document.getElementById('tempatLahir').value,
          tanggalLahir: document.getElementById('tanggalLahir').value,
          noHp: document.getElementById('noHp').value,
          namaOrtu: document.getElementById('namaOrtu').value,
          noHpOrtu: document.getElementById('noHpOrtu').value,
          alamat: document.getElementById('alamat').value,
          fotoUrl: fotoUrlFinal,
          updatedAt: new Date().toISOString()
        };

        await setDoc(doc(db, "biodata_siswa", currentUserUid), dataSiswa);

        fotoUrlLama = fotoUrlFinal; 
        fileFotoBaru = null; 

        tampilkanAlert("Biodata dan Foto berhasil disimpan!", "success");
        kunciForm();

      } catch (error) {
        console.error("Error menyimpan:", error);
        tampilkanAlert("Gagal menyimpan data: " + error.message, "danger");
      } finally {
        btnSimpan.innerText = "Simpan Biodata";
        btnSimpan.disabled = false;
      }
    }

    function kunciForm() {
      document.querySelectorAll('#formBiodata input, #formBiodata select, #formBiodata textarea').forEach(el => el.disabled = true);
      document.getElementById('labelUpload').style.display = 'none';
      document.getElementById('btnSimpan').style.display = 'none';
      document.getElementById('btnEdit').style.display = 'block';
    }

    window.aktifkanEdit = function() {
      document.querySelectorAll('#formBiodata input, #formBiodata select, #formBiodata textarea').forEach(el => el.disabled = false);
      document.getElementById('labelUpload').style.display = 'block';
      document.getElementById('btnSimpan').style.display = 'block';
      document.getElementById('btnEdit').style.display = 'none';
    }

    function tampilkanAlert(pesan, tipe) {
      const alertBox = document.getElementById('alertBox');
      alertBox.innerHTML = pesan;
      alertBox.className = `alert alert-${tipe}`;
      alertBox.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if(tipe === 'success') {
         setTimeout(() => { alertBox.style.display = 'none'; }, 5000);
      }
    }
  </script>

</body>
</html>
